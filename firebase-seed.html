<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed Firebase | Mario Roberto</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d0d0d;
            --panel: #171717;
            --line: rgba(201, 168, 76, 0.22);
            --text: #f7f1df;
            --muted: #c2b58a;
            --accent: #c9a84c;
            --accent-soft: #e8d5a3;
            --danger: #ff8a80;
            --ok: #9be7a8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at top, #1d1b15 0%, var(--bg) 55%);
            font-family: Arial, sans-serif;
            color: var(--text);
        }

        .panel {
            width: min(720px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
        }

        p {
            margin: 0 0 14px;
            color: var(--muted);
            line-height: 1.5;
        }

        .meta {
            margin: 18px 0;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
        }

        .meta code,
        pre,
        .status {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 18px 0;
        }

        button {
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #0d0d0d;
            font-weight: 700;
            border-radius: 999px;
            padding: 12px 18px;
            cursor: pointer;
        }

        button.secondary {
            background: transparent;
            color: var(--accent-soft);
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .status {
            min-height: 24px;
            margin: 10px 0 0;
        }

        .status.ok { color: var(--ok); }
        .status.error { color: var(--danger); }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            margin: 18px 0 0;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, 0.22);
            color: var(--text);
        }
    </style>
</head>
<body>
    <main class="panel">
        <h1>Seed Firebase del evento</h1>
        <p>Esta utilidad intenta crear en Firebase la estructura del evento actual: <code>config</code>, <code>invitados</code>, <code>rsvp</code> y <code>deseos</code>.</p>

        <section class="meta">
            <p><strong>Evento:</strong> <code id="event-id">marioroberto2027</code></p>
            <p><strong>Ruta base:</strong> <code id="event-path">eventos/marioroberto2027</code></p>
        </section>

        <div class="actions">
            <button id="btn-seed" type="button">Crear datos en Firebase</button>
            <button id="btn-check" type="button" class="secondary">Verificar conexión</button>
        </div>

        <div id="seed-status" class="status"></div>
        <pre id="seed-output">Esperando acción...</pre>
    </main>

    <script src="config.js"></script>
    <script src="guest-seeds.js"></script>
    <script type="module" src="database.js"></script>
    <script src="firebase-seed.js"></script>
</body>
</html>
